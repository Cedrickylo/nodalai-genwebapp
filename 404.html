<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) - Nodal AI</title>
    <meta name="description" content="The page you requested could not be found. Return to Nodal AI to continue generating practice quizzes.">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Inter", system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <main id="main-content" class="max-w-md w-full text-center space-y-6 bg-gray-800/90 border border-gray-700/80 rounded-2xl p-8 shadow-2xl backdrop-blur-md">
        <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-4 border-blue-500/20 animate-pulse"></div>
            <div class="relative z-10 p-4 bg-blue-500/10 rounded-full text-blue-400">
                <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Question Mark Icon">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
        </div>

        <div class="space-y-2">
            <span class="text-xs font-bold tracking-widest text-blue-400 uppercase bg-blue-950/60 px-3 py-1 rounded-full border border-blue-800/40">Error 404</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Page Not Found</h1>
            <p class="text-sm text-gray-300 leading-relaxed">
                The link or page you are looking for does not exist or has been relocated.
            </p>
        </div>

        <div class="pt-2">
            <a href="/" class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 px-6 rounded-xl transition-all shadow-lg shadow-blue-900/30 transform hover:scale-[1.01] focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-gray-900">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Return to Nodal AI Home</span>
            </a>
        </div>

        <footer class="pt-4 border-t border-gray-700/60 text-xs text-gray-400">
            Nodal AI &bull; Interactive Study Companion &bull; <a href="mailto:jc.siason08@gmail.com" class="text-blue-400 hover:underline">Support</a>
        </footer>
    </main>
</body>
</html>
